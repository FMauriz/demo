<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Stratego</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Segoe UI', sans-serif; background: #1a1a2e; color: #eee;
         display: flex; flex-direction: column; align-items: center; padding: 10px; }
  h2 { margin: 8px 0; font-size: 20px; }

  #turn { font-size: 16px; font-weight: bold; padding: 5px 16px;
          border-radius: 6px; margin-bottom: 8px; }
  #turn.p1 { background: #2980b9; }
  #turn.p2 { background: #c0392b; }

  #board { display: grid; grid-template-columns: repeat(10, 42px);
           grid-template-rows: repeat(10, 42px); gap: 1px;
           background: #444; border: 2px solid #666; }
  .cell { width: 42px; height: 42px; display: flex; align-items: center;
          justify-content: center; background: #e8d5b7; cursor: pointer;
          position: relative; transition: background .15s; }
  .cell.p1-zone { background: #d4e6f1; }
  .cell.p2-zone { background: #fadbd8; }
  .cell.valid-move { background: #a9dfbf !important; box-shadow: inset 0 0 8px #27ae60; }
  .cell.valid-attack { background: #f5b7b1 !important; box-shadow: inset 0 0 8px #e74c3c; }
  .cell.selected { outline: 3px solid #f1c40f; outline-offset: -2px;
                   background: #f9e79f !important; z-index: 2; }

  .piece { font-size: 8px; font-weight: 700; text-align: center; line-height: 1.1;
           width: 36px; height: 36px; display: flex; align-items: center;
           justify-content: center; border-radius: 4px; pointer-events: none; }
  .piece.p1 { background: #2980b9; color: #fff; }
  .piece.p2 { background: #c0392b; color: #fff; }
  .piece.hidden { background: #333; color: #888; font-size: 16px; }
  .piece.revealed { border: 2px solid #f1c40f; box-shadow: 0 0 6px #f1c40f; }

  #score { display: flex; gap: 12px; margin-top: 10px; width: 100%; max-width: 422px; }
  .score-panel { flex: 1; background: #16213e; border-radius: 6px; padding: 8px; }
  .score-panel h4 { font-size: 11px; margin-bottom: 4px; }
  .score-panel.p1 h4 { color: #5dade2; }
  .score-panel.p2 h4 { color: #ec7063; }
  .captured { font-size: 9px; color: #bbb; line-height: 1.4; }
  .captured span { display: inline-block; background: #2c3e50; padding: 1px 3px;
                   border-radius: 3px; margin: 1px; font-size: 8px; }

  #battle-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%;
                    height: 100%; background: rgba(0,0,0,.7); z-index: 100;
                    justify-content: center; align-items: center; }
  #battle-overlay.show { display: flex; }
  #battle-box { background: #1a1a2e; border: 3px solid #f39c12; border-radius: 12px;
               padding: 24px; text-align: center; min-width: 260px;
               animation: popIn .3s ease; }
  @keyframes popIn { from { transform: scale(.7); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  @keyframes flip {
  0%   { transform: rotateY(90deg); }
  100% { transform: rotateY(0deg); }
}
  #battle-box h3 { font-size: 18px; margin-bottom: 12px; color: #f39c12; }
  #battle-box .fighters { display: flex; justify-content: center; gap: 16px; margin-bottom: 12px; }
  #battle-box .fighter { text-align: center; }
  #battle-box .fighter .f-piece { font-size: 11px; font-weight: bold; padding: 6px 10px;
                                   border-radius: 6px; display: inline-block; }
  #battle-box .fighter .f-piece.winner { background: #27ae60; color: #fff; }
  #battle-box .fighter .f-piece.loser { background: #c0392b; color: #fff;
                                         text-decoration: line-through; }
  #battle-box .fighter .f-piece.draw { background: #7f8c8d; color: #fff;
                                        text-decoration: line-through; }
  #battle-box .vs { font-size: 20px; color: #f39c12; align-self: center; }
  #battle-box .result { font-size: 14px; margin-bottom: 14px; }
  #battle-box button { background: #f39c12; border: none; padding: 8px 24px;
                       border-radius: 6px; font-size: 14px; font-weight: bold;
                       cursor: pointer; color: #1a1a2e; }
  #battle-box button:hover { background: #e67e22; }

  #log { margin-top: 10px; width: 422px; max-height: 100px; overflow-y: auto;
         background: #16213e; padding: 6px; border-radius: 4px;
         font-size: 11px; line-height: 1.5; }
  #log .entry { border-bottom: 1px solid #2c3e50; padding: 2px 0; }

  #new-game { margin-top: 8px; background: #27ae60; color: #fff; border: none;
              padding: 6px 16px; border-radius: 4px; cursor: pointer; font-size: 13px; }
  #new-game:hover { background: #219a52; }
</style>
</head>
<body>

<h2>Stratego – 2 Jugadores</h2>
<div id="turn"></div>
<div id="board"></div>
<div id="score">
  <div class="score-panel p1"><h4>🔵 Capturas J1</h4><div class="captured" id="cap1">—</div></div>
  <div class="score-panel p2"><h4>🔴 Capturas J2</h4><div class="captured" id="cap2">—</div></div>
</div>
<div id="log"></div>
<button id="new-game" onclick="newGame()">🔄 Nueva partida</button>

<div id="battle-overlay">
  <div id="battle-box">
    <h3>⚔️ ¡Combate!</h3>
    <div class="fighters" id="fighters"></div>
    <div class="result" id="battle-result"></div>
    <button onclick="closeBattle()">Continuar</button>
  </div>
</div>

<script>
// ═══════════════════════════════════════════
//  PIEZAS (set clásico: 40 por jugador)
// ═══════════════════════════════════════════
const PIECES = {
  mariscal:   { rank: 10, type: 'soldier', label: 'Mars/10' },
  general:    { rank: 9,  type: 'soldier', label: 'Gral/9'  },
  coronel:    { rank: 8,  type: 'soldier', label: 'Cor/8'   },
  mayor:      { rank: 7,  type: 'soldier', label: 'Maj/7'   },
  capitan:    { rank: 6,  type: 'soldier', label: 'Cap/6'   },
  teniente:   { rank: 5,  type: 'soldier', label: 'Ten/5'   },
  sargento:   { rank: 4,  type: 'soldier', label: 'Sgt/4'   },
  minador:    { rank: 3,  type: 'soldier', label: 'Min/3'   },
  explorador: { rank: 2,  type: 'soldier', label: 'Exp/2'   },
  espia:      { rank: 1,  type: 'soldier', label: 'Esp/1'   },
  bomba:      { rank: 0,  type: 'bomba',   label: '💣'      },
  bandera:    { rank: 0,  type: 'bandera', label: '🚩'      },
};

// Set exacto: 40 piezas
function getPieceSet() {
  return [
    'mariscal',           // 1
    'general',            // 1
    'coronel','coronel',  // 2
    'mayor','mayor','mayor',       // 3
    'capitan','capitan','capitan','capitan', // 4
    'teniente','teniente','teniente','teniente', // 4
    'sargento','sargento','sargento','sargento', // 4
    'minador','minador','minador','minador','minador', // 5
    'explorador','explorador','explorador','explorador',
    'explorador','explorador','explorador','explorador', // 8
    'espia',              // 1
    'bomba','bomba','bomba','bomba','bomba','bomba', // 6
    'bandera'             // 1
  ]; // Total: 40
}

// ═══════════════════════════════════════════
//  ESTADO
// ═══════════════════════════════════════════
let board = [];
let currentPlayer = 1;
let selectedCell = null;
let gameOver = false;
let captures = { 1: [], 2: [] };

// ═══════════════════════════════════════════
//  REPARTO ALEATORIO (4 filas × 10 = 40 celdas, 40 piezas)
// ═══════════════════════════════════════════
function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

function randomPlacement(owner) {
  const rows = owner === 1 ? [6, 7, 8, 9] : [0, 1, 2, 3];
  const flagRow = owner === 1 ? 9 : 0;
  const bombRows = owner === 1 ? [8, 9] : [0, 1];

  const pieces = shuffle(getPieceSet());
  const grid = Array.from({ length: 10 }, () => Array(10).fill(null));

  // 1. Bandera en la fila trasera
  const flagCol = Math.floor(Math.random() * 10);
  grid[flagRow][flagCol] = 'bandera';

  // 2. Bombas en las 2 filas traseras (evitando la celda de la bandera)
  const bombCells = [];
  for (const r of bombRows) {
    for (let c = 0; c < 10; c++) {
      if (!grid[r][c]) bombCells.push([r, c]);
    }
  }
  shuffle(bombCells);
  const numBombs = pieces.filter(p => p === 'bomba').length; // 6
  for (let i = 0; i < numBombs; i++) {
    const [r, c] = bombCells[i];
    grid[r][c] = 'bomba';
  }

  // 3. Resto (33 piezas) en las celdas libres de la zona (37 libres)
  const remaining = pieces.filter(p => p !== 'bomba' && p !== 'bandera');
  const freeCells = [];
  for (const r of rows) {
    for (let c = 0; c < 10; c++) {
      if (!grid[r][c]) freeCells.push([r, c]);
    }
  }
  shuffle(freeCells);
  for (let i = 0; i < remaining.length; i++) {
    const [r, c] = freeCells[i];
    grid[r][c] = remaining[i];
  }

  // Convertir a objetos en el board
  for (const r of rows) {
    for (let c = 0; c < 10; c++) {
      if (grid[r][c]) {
        board[r][c] = {
          pieceId: grid[r][c],
          ...PIECES[grid[r][c]],
          owner,
          revealed: false
        };
      }
    }
  }
}

function initBoard() {
  board = Array.from({ length: 10 }, () => Array(10).fill(null));
  randomPlacement(1);
  randomPlacement(2);
}

// ═══════════════════════════════════════════
//  MOVIMIENTO Y COMBATE
// ═══════════════════════════════════════════
function getValidMoves(r, c) {
  const cell = board[r][c];
  if (!cell || cell.owner !== currentPlayer) return [];
  if (cell.type !== 'soldier') return [];

  const moves = [];
  const dirs = [[-1,0],[1,0],[0,-1],[0,1]];
  for (const [dr, dc] of dirs) {
    const nr = r + dr, nc = c + dc;
    if (nr >= 0 && nr < 10 && nc >= 0 && nc < 10) {
      const target = board[nr][nc];
      if (!target) moves.push({ r: nr, c: nc, type: 'move' });
      else if (target.owner !== currentPlayer) moves.push({ r: nr, c: nc, type: 'attack' });
    }
  }
  return moves;
}

function resolveCombat(att, def) {
  // Espía vs Mariscal
  if (att.pieceId === 'espia' && def.pieceId === 'mariscal') return 'attacker';
  if (def.pieceId === 'espia' && att.pieceId === 'mariscal') return 'defender';
  // Espía ataca a otro → pierde
  if (att.pieceId === 'espia' && def.pieceId !== 'mariscal' && def.pieceId !== 'bandera') return 'defender';
  // Minador vs Bomba
  if (att.pieceId === 'minador' && def.pieceId === 'bomba') return 'attacker';
  if (def.pieceId === 'minador' && att.pieceId === 'bomba') return 'defender';
  // Bomba (defensora) mata al atacante (no minador)
  if (def.pieceId === 'bomba') return 'defender';
  // Bandera: se captura
  if (def.pieceId === 'bandera') return 'attacker';
  if (att.pieceId === 'bandera') return 'defender';
  // Rango
  if (att.rank > def.rank) return 'attacker';
  if (def.rank > att.rank) return 'defender';
  return 'both';
}

function makeMove(fromR, fromC, toR, toC) {
  const from = board[fromR][fromC];
  const to = board[toR][toC];
  if (!from || from.owner !== currentPlayer || from.type !== 'soldier') return;

  if (to && to.owner !== currentPlayer) {
    const result = resolveCombat(from, to);
    from.revealed = true;
    to.revealed = true;

    if (result === 'attacker') {
      captures[currentPlayer].push(to.pieceId);
      board[toR][toC] = from;
      board[fromR][fromC] = null;
    } else if (result === 'defender') {
      captures[to.owner].push(from.pieceId);
      board[fromR][fromC] = null;
    } else {
      captures[currentPlayer].push(to.pieceId);
      captures[to.owner].push(from.pieceId);
      board[fromR][fromC] = null;
      board[toR][toC] = null;
    }
    showBattle(from, to, result);
  } else if (!to) {
    board[toR][toC] = from;
    board[fromR][fromC] = null;
  }

  checkWin();
  currentPlayer = currentPlayer === 1 ? 2 : 1;
  selectedCell = null;
  render();
}

// ═══════════════════════════════════════════
//  MODAL COMBATE
// ═══════════════════════════════════════════
function showBattle(att, def, result) {
  const attLabel = PIECES[att.pieceId].label;
  const defLabel = PIECES[def.pieceId].label;

  let attClass, defClass, msg;
  if (result === 'attacker') {
    attClass = 'winner'; defClass = 'loser';
    msg = `🏆 ${attLabel} (J${att.owner}) gana`;
  } else if (result === 'defender') {
    attClass = 'loser'; defClass = 'winner';
    msg = `🏆 ${defLabel} (J${def.owner}) gana`;
  } else {
    attClass = 'draw'; defClass = 'draw';
    msg = '💥 ¡Empate! Ambas eliminadas';
  }

  document.getElementById('fighters').innerHTML = `
    <div class="fighter"><div class="f-piece ${attClass}">${attLabel}<br><small>J${att.owner}</small></div></div>
    <div class="vs">⚔️</div>
    <div class="fighter"><div class="f-piece ${defClass}">${defLabel}<br><small>J${def.owner}</small></div></div>
  `;
  document.getElementById('battle-result').textContent = msg;
  document.getElementById('battle-overlay').classList.add('show');
}

function closeBattle() {
  document.getElementById('battle-overlay').classList.remove('show');
  render();
}

// ═══════════════════════════════════════════
//  VICTORIA
// ═══════════════════════════════════════════
function checkWin() {
  for (let p = 1; p <= 2; p++) {
    let hasFlag = false, hasMovers = 0;
    for (let r = 0; r < 10; r++)
      for (let c = 0; c < 10; c++)
        if (board[r][c] && board[r][c].owner === p) {
          if (board[r][c].pieceId === 'bandera') hasFlag = true;
          if (board[r][c].type === 'soldier') hasMovers++;
        }
    if (!hasFlag || hasMovers === 0) {
      gameOver = true;
      logEntry(`🏆 ¡Jugador ${p === 1 ? 2 : 1} gana!`);
    }
  }
}

// ═══════════════════════════════════════════
//  RENDER
// ═══════════════════════════════════════════
function render() {
  const turnEl = document.getElementById('turn');
  turnEl.textContent = gameOver ? '🏁 Juego terminado' : `Turno: Jugador ${currentPlayer}`;
  turnEl.className = gameOver ? '' : (currentPlayer === 1 ? 'p1' : 'p2');

  document.getElementById('cap1').innerHTML = captures[1].length
    ? captures[1].map(p => `<span>${PIECES[p].label}</span>`).join('') : '—';
  document.getElementById('cap2').innerHTML = captures[2].length
    ? captures[2].map(p => `<span>${PIECES[p].label}</span>`).join('') : '—';

  let validSet = new Set(), attackSet = new Set();
  if (selectedCell) {
    const moves = getValidMoves(selectedCell[0], selectedCell[1]);
    for (const m of moves) {
      const key = `${m.r},${m.c}`;
      if (m.type === 'move') validSet.add(key);
      else attackSet.add(key);
    }
  }

  const el = document.getElementById('board');
  el.innerHTML = '';
  for (let r = 0; r < 10; r++) {
    for (let c = 0; c < 10; c++) {
      const cell = document.createElement('div');
      cell.className = 'cell';
      if (r >= 6) cell.classList.add('p1-zone');
      else if (r <= 3) cell.classList.add('p2-zone');

      const key = `${r},${c}`;
      if (validSet.has(key)) cell.classList.add('valid-move');
      if (attackSet.has(key)) cell.classList.add('valid-attack');
      if (selectedCell && selectedCell[0] === r && selectedCell[1] === c)
        cell.classList.add('selected');

      const p = board[r][c];
      if (p) {
        const span = document.createElement('span');
        span.className = 'piece';

        // ✅ REGLA: se oculta solo si es del RIVAL y no está revelada
        const isOpponent = p.owner !== currentPlayer;
        const isHidden = isOpponent && !p.revealed;

        if (isHidden) {
          span.classList.add('hidden');
          span.textContent = '?';
        } else {
          // Pieza visible: mantener color del dueño
          span.classList.add(`p${p.owner}`);
          if (p.revealed) span.classList.add('revealed');
          span.textContent = PIECES[p.pieceId].label;
          // Animación de giro al "descubrirse"
          if (p.revealed) span.style.animation = 'flip .4s ease';
        }

        cell.appendChild(span);
      }

      cell.addEventListener('click', () => handleClick(r, c));
      el.appendChild(cell);
    }
  }
}   

function handleClick(r, c) {
  if (gameOver) return;
  if (selectedCell) {
    const [sr, sc] = selectedCell;
    if (sr === r && sc === c) { selectedCell = null; }
    else {
      const moves = getValidMoves(sr, sc);
      const isValid = moves.some(m => m.r === r && m.c === c);
      if (isValid) makeMove(sr, sc, r, c);
      else {
        const cell = board[r][c];
        if (cell && cell.owner === currentPlayer && cell.type === 'soldier')
          selectedCell = [r, c];
        else selectedCell = null;
      }
    }
  } else {
    const cell = board[r][c];
    if (cell && cell.owner === currentPlayer && cell.type === 'soldier')
      selectedCell = [r, c];
  }
  render();
}

function logEntry(msg) {
  const log = document.getElementById('log');
  const div = document.createElement('div');
  div.className = 'entry';
  div.textContent = msg;
  log.prepend(div);
}

function newGame() {
  currentPlayer = 1;
  selectedCell = null;
  gameOver = false;
  captures = { 1: [], 2: [] };
  document.getElementById('log').innerHTML = '';
  document.getElementById('battle-overlay').classList.remove('show');
  initBoard();
  render();
}

newGame();
</script>
</body>
</html>
