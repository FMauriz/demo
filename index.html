function generarListasPorAcordes() {
  const marcas = ["🟢", "🟡", "🔴", "🔵", "🟠", "🟩", "🟨", "🟥", "🟦", "#LVL_", "#BPM_"];
  playlists = playlists.filter(pl => pl && pl.name && !marcas.some(m => pl.name.startsWith(m)));

  const niveles = [
    { tag: "#LVL_1#", ids: [] },
    { tag: "#LVL_2#", ids: [] },
    { tag: "#LVL_3#", ids: [] },
    { tag: "#LVL_4#", ids: [] }
  ];

  const rangosBpm = [
    { tag: "#BPM_1#", ids: [] },
    { tag: "#BPM_2#", ids: [] },
    { tag: "#BPM_3#", ids: [] },
    { tag: "#BPM_4#", ids: [] }
  ];

  songs.forEach(cancion => {
    // 1. Clasificación por número de acordes
    const num = ukeContarAcordes(cancion.letra);
    if (num > 0) {
      if (num <= 2) niveles.at(0).ids.push(cancion.id);
      else if (num <= 4) niveles.at(1).ids.push(cancion.id);
      else if (num <= 6) niveles.at(2).ids.push(cancion.id);
      else niveles.at(3).ids.push(cancion.id);
    }

    // 2. Clasificación por velocidad (BPM)
    const bpm = Number(cancion.bpm);
    if (bpm && !isNaN(bpm) && bpm > 0) {
      if (bpm < 95) rangosBpm.at(0).ids.push(cancion.id);
      else if (bpm < 120) rangosBpm.at(1).ids.push(cancion.id);
      else if (bpm < 140) rangosBpm.at(2).ids.push(cancion.id);
      else rangosBpm.at(3).ids.push(cancion.id);
    }
  });

  niveles.forEach(niv => {
    if (niv.ids.length > 0) {
      playlists.push({ name: niv.tag, songs: niv.ids });
    }
  });

  rangosBpm.forEach(rango => {
    if (rango.ids.length > 0) {
      playlists.push({ name: rango.tag, songs: rango.ids });
    }
  });

  saveData();
  renderPlaylists();
}

function renderPlaylists() {
  const container = document.getElementById('playlistList');
  if (playlists.length === 0) {
    container.innerHTML = `<p style="color:var(--text-light);font-size:0.8rem;">${t('listas.sin_listas', 'Sin listas')}</p>`;
    return;
  }

  const estiloNiveles = {
    "#LVL_1#": { key: "listas.nivel_verde",    def: "Nivel 1 · Básico (1-2 acordes)",   color: "#16a34a", bg: "rgba(22, 163, 74, 0.08)" },
    "#LVL_2#": { key: "listas.nivel_amarillo", def: "Nivel 2 · Fácil (3-4 acordes)",    color: "#eab308", bg: "rgba(234, 179, 8, 0.08)" },
    "#LVL_3#": { key: "listas.nivel_rojo",     def: "Nivel 3 · Medio (5-6 acordes)",    color: "#dc2626", bg: "rgba(220, 38, 38, 0.08)" },
    "#LVL_4#": { key: "listas.nivel_azul",     def: "Nivel 4 · Avanzado (7+ acordes)",  color: "#2563eb", bg: "rgba(37, 99, 235, 0.08)" },
    "#BPM_1#": { key: "listas.bpm_verde",      def: "🟩 Lentas (< 95 BPM)",             color: "#16a34a", bg: "rgba(22, 163, 74, 0.08)" },
    "#BPM_2#": { key: "listas.bpm_amarillo",   def: "🟨 Medio (95 - 119 BPM)",          color: "#eab308", bg: "rgba(234, 179, 8, 0.08)" },
    "#BPM_3#": { key: "listas.bpm_rojo",       def: "🟥 Alegres (120 - 139 BPM)",       color: "#dc2626", bg: "rgba(220, 38, 38, 0.08)" },
    "#BPM_4#": { key: "listas.bpm_azul",       def: "🟦 Rápidas (140+ BPM)",            color: "#2563eb", bg: "rgba(37, 99, 235, 0.08)" }
  };

  // Función auxiliar que renderiza cada ítem individual respetando su índice real 'i' en playlists
  const renderItemPlaylist = (pl, i) => {
    const isActive = i === activePlaylist;
    const flecha = isActive ? '▼' : '▶';
    const nombreLimpio = pl.name.replace("#VOTO_TMP#", "");
    const metaNivel = estiloNiveles[nombreLimpio];

    const nombreVisible = metaNivel ? t(metaNivel.key, metaNivel.def) : nombreLimpio;
    const esListaEnVotacion = (typeof estadoVotacion !== "undefined") && estadoVotacion.activa && (estadoVotacion.listaTag === nombreLimpio);

    let estiloExtra = metaNivel ? `border-left: 4px solid ${metaNivel.color}; background: ${metaNivel.bg};` : '';
    if (esListaEnVotacion) {
      if (!soyElAnfitrion && estadoVotacion.yaVote) {
        estiloExtra = 'border-left: 4px solid #10b981; background: rgba(16, 185, 129, 0.14);';
      } else {
        estiloExtra = 'border-left: 4px solid #f59e0b; background: rgba(245, 158, 11, 0.16);';
      }
    }

    const textoContador = t('listas.canciones_count', '{n} canciones', { n: pl.songs.length });

    let bannerVotacion = '';
    if (esListaEnVotacion && !soyElAnfitrion) {
      bannerVotacion = estadoVotacion.yaVote
        ? `<div style="padding:0.35rem 0.6rem;font-size:0.78rem;font-weight:bold;color:${estadoVotacion.votoConfirmado ? '#059669' : '#b45309'};background:rgba(16,185,129,0.1);">${estadoVotacion.mensajeVoto || t('votacion.voto_enviado', '✓ Voto enviado. Esperando confirmación del Anfitrión...')}</div>`
        : `<div style="padding:0.35rem 0.6rem;font-size:0.78rem;font-weight:bold;color:#d97706;background:rgba(245,158,11,0.12);">${t('votacion.banner_votar', '👇 Pulsa sobre tu canción favorita para votar:')}</div>`;
    }

    const songsHtml = isActive ? pl.songs.map(id => {
      const cancionFallback = esListaEnVotacion && !soyElAnfitrion
        ? estadoVotacion.listaPersonalizada?.find(x => x.id === id)
        : null;
      const s = cancionFallback || songs.find(x => x.id === id);
      const tituloTema = s ? s.titulo : (estadoVotacion.listaPersonalizada?.find(x => x.id === id)?.titulo || '');
      if (!tituloTema) return '';

      let accionClick = `selectSongById(${id})`;
      let cursorStyle = 'cursor:pointer;';
      let badgeVotos = '';

      if (esListaEnVotacion) {
        if (soyElAnfitrion) {
          const votos = estadoVotacion.votosPorCancion[id] || 0;
          badgeVotos = votos > 0 ? ` <strong style="color:#d97706;">[${votos} 🗳️]</strong>` : '';
          accionClick = `lanzarCancionGanadoraClub(${id})`;
        } else if (estadoVotacion.yaVote) {
          accionClick = '';
          cursorStyle = 'cursor:not-allowed;opacity:0.65;';
        } else {
          accionClick = `emitirVotoCancion(${id})`;
        }
      }

      return `<div style="display:flex;align-items:center;justify-content:space-between;padding:0.3rem 0.5rem 0.3rem 0.9rem;font-size:0.82rem;border-bottom:1px solid rgba(0,0,0,0.05);">
        <span style="${cursorStyle}flex:1;" onclick="${accionClick}">${tituloTema}${badgeVotos}</span>
        ${!esListaEnVotacion ? `<button class="btn btn-sm" style="padding:0.1rem 0.35rem;font-size:0.7rem;background:transparent;color:inherit;border:1px solid rgba(0,0,0,0.15);opacity:0.65;" onclick="removeFromPlaylistById(${i},${id})">✕</button>` : ''}
      </div>`;
    }).join('') : '';

    const btnProponerVoto = (typeof soyElAnfitrion !== "undefined" && soyElAnfitrion && conexionesClub.some(c => c && c.open))
      ? `<button class="btn btn-sm" style="padding:0.2rem 0.45rem;background:rgba(245,158,11,0.18);color:inherit;border:1px solid rgba(245,158,11,0.4);" onclick="event.stopPropagation(); iniciarVotacionLista(${i})" title="Proponer lista a votación">🗳️</button>`
      : '';

    return `
      <div class="playlist-item ${isActive ? 'active-pl' : ''}" style="margin-bottom:0.35rem; ${estiloExtra}">
        <div style="display:flex;align-items:center;flex:1;gap:6px;">
          <span onclick="event.stopPropagation(); toggleAcordeonLista(${i})" style="cursor:pointer;padding:0.35rem 0.5rem;font-size:0.8rem;opacity:0.8;border-radius:4px;background:rgba(0,0,0,0.04);">${flecha}</span>

            <div class="pl-count" style="font-size:0.75rem;opacity:0.8;">${textoContador}</div>
          </div>
        </div>
        <div style="display:flex;gap:0.25rem;">
          ${btnProponerVoto}
          <button class="btn btn-sm" style="padding:0.2rem 0.45rem;background:transparent;color:inherit;border:1px solid rgba(0,0,0,0.15);opacity:0.65;" onclick="event.stopPropagation(); printPlaylist(${i})">🖨️</button>

        </div>
      </div>
      ${isActive ? `<div style="max-height:240px;overflow-y:auto;margin-bottom:0.6rem;border-radius:6px;${esListaEnVotacion ? 'border:1px solid rgba(245,158,11,0.35);' : ''}">${bannerVotacion}${songsHtml}</div>` : ''}`;
  };

  // Separamos las listas en 3 bloques manteniendo su índice real 'i' en playlists
  const grupoAcordes = [];
  const grupoBpm = [];
  const listasUsuario = [];

  playlists.forEach((pl, i) => {
    const limpio = pl.name.replace("#VOTO_TMP#", "");
    if (limpio.startsWith("#LVL_")) grupoAcordes.push({ pl, i });
    else if (limpio.startsWith("#BPM_")) grupoBpm.push({ pl, i });
    else listasUsuario.push({ pl, i });
  });

  // Si hay una votación activa o una sublista abierta dentro de Acordes/BPM, desplegamos su carpeta automáticamente
  const votoTag = (typeof estadoVotacion !== "undefined" && estadoVotacion.activa) ? estadoVotacion.listaTag : "";
  const abrirAcordes = window.grupoAcordesAbierto || votoTag.startsWith("#LVL_") || grupoAcordes.some(x => x.i === activePlaylist);
  const abrirBpm = window.grupoBpmAbierto || votoTag.startsWith("#BPM_") || grupoBpm.some(x => x.i === activePlaylist);

  let htmlFinal = '';

  // 1. Acordeón superior: Por nivel de acordes
  if (grupoAcordes.length > 0) {
    htmlFinal += `
      <div style="margin-bottom:0.45rem;border:1px solid rgba(148,163,184,0.28);border-radius:6px;overflow:hidden;">
        <div onclick="window.toggleGrupoAutomatico('acordes')" style="display:flex;align-items:center;justify-content:space-between;padding:0.45rem 0.65rem;background:rgba(148,163,184,0.12);cursor:pointer;font-weight:600;font-size:0.84rem;">

      </div>`;
  }

  // 2. Acordeón superior: Por velocidad (BPM)
  if (grupoBpm.length > 0) {
    htmlFinal += `

// 1. El Anfitrión lanza una lista a votación (se llamará desde el botón 🗳️ en renderPlaylists)
function iniciarVotacionLista(indexLista) {
  if (!soyElAnfitrion) return;
  const pl = playlists.at(indexLista);
  if (!pl || pl.songs.length === 0) return;
  const votacionId = `${Date.now()}-${Math.random().toString(36).slice(2, 8)}`;

  // Reiniciamos marcas y título votado en todos los conectados
  conexionesClub.forEach(c => {
    if (c) {
      c.haVotado = false;
      c.votoTitulo = "";
    }
  });
  if (estadoVotacion.timerCierre) clearTimeout(estadoVotacion.timerCierre);

  // Enviamos siempre el listado resumen como respaldo por si el invitado no tiene esa lista generada
  const resumenCanciones = pl.songs.map(id => {
    const s = songs.find(x => x.id === id);
    return s ? { id: s.id, titulo: s.titulo } : null;
  }).filter(Boolean);

  estadoVotacion = {
    activa: true,
    esAnfitrion: true,
    votacionId,
    listaTag: pl.name,
    listaPersonalizada: resumenCanciones,
    yaVote: false,
    votosPorCancion: {},
    resultadoAnunciado: false,
    timerCierre: null
  };

  let enviados = 0;
  conexionesClub.forEach(c => {
    if (c && c.open) {
      c.send({
        accion: "PROPUESTA_LISTA_VOTACION",
        votacionId,
        listaTag: pl.name,
        cancionesFallback: resumenCanciones
      });
      enviados++;
      const nombreInvitado = c.metadata?.nombre || c.nombre || t('p2p.lista.musico_defecto', 'Músico');
      registrarEventoAnfitrion('invitacion', t('p2p.log_invitacion_votar', 'Invitación para votar «{lista}» enviada a {nombre}', {
        lista: pl.name,
        nombre: nombreInvitado
      }));
    }
  });

  if (typeof registrarEventoAnfitrion === 'function') {
    const mapaNombres = {
      "#LVL_1#": t("listas.nivel_verde", "Nivel 1 · Básico (1-2 acordes)"),
      "#LVL_2#": t("listas.nivel_amarillo", "Nivel 2 · Fácil (3-4 acordes)"),
      "#LVL_3#": t("listas.nivel_rojo", "Nivel 3 · Medio (5-6 acordes)"),
      "#LVL_4#": t("listas.nivel_azul", "Nivel 4 · Avanzado (7+ acordes)"),
      "#BPM_1#": t("listas.bpm_verde", "🟩 Lentas (< 95 BPM)"),
      "#BPM_2#": t("listas.bpm_amarillo", "🟨 Medio (95 - 119 BPM)"),
      "#BPM_3#": t("listas.bpm_rojo", "🟥 Alegres (120 - 139 BPM)"),
      "#BPM_4#": t("listas.bpm_azul", "🟦 Rápidas (140+ BPM)")
    };
    const nombreVisible = mapaNombres[pl.name] || pl.name;
    registrarEventoAnfitrion('votacion', t('p2p.log_voto_inicio', 'Votación abierta: {lista}', { lista: `${nombreVisible} (${enviados})` }));
  }

  activePlaylist = indexLista;
  renderPlaylists();
  retransmitirListaUsuariosATodos();
  if (typeof actualizarListaUsuariosUI === 'function') actualizarListaUsuariosUI();

  estadoVotacion.timerCierre = setTimeout(() => comprobarResolucionVotacion(true), 25000);
}

// 3. Al aceptar el Músico: abre su panel de listas en primer plano y prepara el estado
function aceptarYAbrirListaVotacion(paquete) {
  if (paquete.votacionId && paquete.votacionId === ultimaVotacionCerradaId) {
    estadoVotacion.activa = false;
    return;
  }

  if (songs.length === 0 && !Array.isArray(paquete.cancionesFallback)) {
    alert(t("votacion.tablet_vacia", "Tu cancionero aún está vacío. Recibirás la ganadora cuando termine la votación."));
    return;
  }

  // Si es una lista de niveles y el usuario aún no las tenía generadas, las generamos al vuelo
  if ((paquete.listaTag.startsWith("#LVL_") || paquete.listaTag.startsWith("#BPM_")) && !playlists.some(p => p.name === paquete.listaTag)) {
    generarListasPorAcordes();
  }

  estadoVotacion = {
    activa: true,
    esAnfitrion: false,
    votacionId: paquete.votacionId || null,
    listaTag: paquete.listaTag,
    listaPersonalizada: paquete.cancionesFallback || null,
    yaVote: false,
    votoConfirmado: false,
    mensajeVoto: '',
    votosPorCancion: {},
    resultadoAnunciado: false,
    timerCierre: null
  };

  // La lista enviada por el Anfitrión conserva los IDs correctos aunque el localStorage difiera.
  let idx = playlists.findIndex(p => p.name === paquete.listaTag);
  if (Array.isArray(paquete.cancionesFallback)) {
    playlists = playlists.filter(p => !p.name.startsWith("#VOTO_TMP#"));
    playlists.unshift({
      name: "#VOTO_TMP#" + paquete.listaTag,
      songs: paquete.cancionesFallback.map(x => x.id)
    });
    idx = 0;
  }

  if (idx !== -1) {
    activePlaylist = idx;
    renderPlaylists();
    // Abrimos el panel deslizante de listas si estaba cerrado
    const panel = document.getElementById("playlistPanel");
    if (panel && !panel.classList.contains("open") && !panel.classList.contains("active")) {
      togglePlaylistPanel();
    }
  }
}

// 4. El Músico pulsa sobre una canción para emitir su voto único
function emitirVotoCancion(songId) {
  if (!estadoVotacion.activa || estadoVotacion.esAnfitrion || estadoVotacion.yaVote) return;

  const cancionLocal = estadoVotacion.listaPersonalizada?.find(x => x.id === songId) || songs.find(x => x.id === songId);
  const tituloVotado = cancionLocal ? cancionLocal.titulo : "";
  const conexionAnfitrion = conexionesClub.find(c => c && c.open);
  if (!conexionAnfitrion) {
    alert(t("votacion.sin_conexion", "No se pudo enviar el voto: no hay conexión activa con el Anfitrión."));
    return;
  }

  try {
    conexionAnfitrion.send({
      accion: "VOTO_LISTA_CLUB",
      votacionId: estadoVotacion.votacionId,
      songId,
      titulo: tituloVotado
    });
  } catch (error) {
    console.error("No se pudo enviar el voto al Anfitrión.", error);
    alert(t("votacion.error_envio", "No se pudo enviar el voto. Comprueba la conexión e inténtalo de nuevo."));
    return;
  }

  estadoVotacion.yaVote = true;
  estadoVotacion.votoConfirmado = false;
  estadoVotacion.mensajeVoto = '';

  renderPlaylists();
}

// 5. El Anfitrión registra el voto y comprueba si se cumple 100% o >50% tras tiempo
function registrarVotoEnAnfitrion(conn, votacionId, songId, tituloRecibido) {
  if (!estadoVotacion.activa || estadoVotacion.resultadoAnunciado || !soyElAnfitrion || votacionId !== estadoVotacion.votacionId) {
    registrarEventoAnfitrion('votacion', t('p2p.log_voto_fuera_de_tiempo', '{nombre} envió un voto, pero la votación ya no está activa.', {
      nombre: conn.metadata?.nombre || conn.nombre || t('p2p.lista.musico_defecto', 'Músico')
    }));
    return { aceptado: false, cerrada: true, motivoClave: 'votacion.votacion_cerrada' };
  }

  if (conn.haVotado) {
    return {
      aceptado: true,
      motivoClave: '',
      titulo: conn.votoTitulo
    };
  }

  const cancionObj = estadoVotacion.listaPersonalizada?.find(x => String(x.id) === String(songId))
    || songs.find(x => String(x.id) === String(songId));
  const idCanonico = cancionObj ? cancionObj.id : songId;
  const votoValido = Array.isArray(estadoVotacion.listaPersonalizada)
    && estadoVotacion.listaPersonalizada.some(x => String(x.id) === String(songId));
  if (!votoValido) {
    const nombreVotante = conn.metadata?.nombre || conn.nombre || t('p2p.lista.musico_defecto', 'Músico');
    registrarEventoAnfitrion('votacion', t('p2p.log_voto_invalido', '{nombre} envió un voto que no pertenece a la lista activa.', {
      nombre: nombreVotante
    }));
    return { aceptado: false, motivoClave: 'votacion.voto_invalido' };
  }

  conn.haVotado = true;
  conn.votoTitulo = tituloRecibido || (cancionObj ? cancionObj.titulo : "");
  estadoVotacion.votosPorCancion[idCanonico] = (estadoVotacion.votosPorCancion[idCanonico] || 0) + 1;
  const nombreVotante = conn.metadata?.nombre || conn.nombre || t('p2p.lista.musico_defecto', 'Músico');
  const tituloVotado = conn.votoTitulo || t('votacion.cancion_desconocida', 'canción desconocida');
  registrarEventoAnfitrion('votacion', t('p2p.log_voto_recibido', '{nombre} votó por: {titulo}', {
    nombre: nombreVotante,
    titulo: tituloVotado
  }));

  renderPlaylists();
  retransmitirListaUsuariosATodos();
  if (typeof actualizarListaUsuariosUI === 'function') actualizarListaUsuariosUI();

  comprobarResolucionVotacion(false);
  return { aceptado: true, motivoClave: '', titulo: conn.votoTitulo };
}

function comprobarResolucionVotacion(tiempoAgotado) {
  if (!estadoVotacion.activa || !soyElAnfitrion) return;

  const activos = conexionesClub.filter(c => c && c.open);
  const totalConectados = activos.length;
  const totalVotados = activos.filter(c => c.haVotado).length;

  if (totalConectados === 0) {
    if (estadoVotacion.timerCierre) clearTimeout(estadoVotacion.timerCierre);
    estadoVotacion.timerCierre = null;
    estadoVotacion.activa = false;
    estadoVotacion.votosPorCancion = {};
    registrarEventoAnfitrion('votacion', t('p2p.log_voto_sin_participantes', 'Votación cerrada: no quedan participantes conectados.'));
    renderPlaylists();
    return;
  }

  const todosVotaron = totalVotados >= totalConectados;
  const masDel50PorTiempo = tiempoAgotado && (totalVotados > totalConectados / 2);

  if (todosVotaron || masDel50PorTiempo) {
    if (estadoVotacion.resultadoAnunciado) return;
    if (estadoVotacion.timerCierre) clearTimeout(estadoVotacion.timerCierre);
    estadoVotacion.timerCierre = null;

    let maxVotos = 0;
    let ganadoras = [];
    for (const [idStr, cuenta] of Object.entries(estadoVotacion.votosPorCancion)) {
      if (cuenta > maxVotos) {
        maxVotos = cuenta;
        ganadoras = [Number(idStr)];
      } else if (cuenta === maxVotos && cuenta > 0) {
        ganadoras.push(Number(idStr));
      }
    }

    if (ganadoras.length > 0) {
      estadoVotacion.resultadoAnunciado = true;
      const resumen = ganadoras.map(id => {
        const cancion = songs.find(s => s.id === id) || estadoVotacion.listaPersonalizada?.find(s => s.id === id);
        return `${cancion?.titulo || id} (${maxVotos})`;
      }).join(', ');
      const mensaje = ganadoras.length > 1
        ? t("votacion.empate", "⚖️ Empate en la votación: pulsa la canción ganadora para lanzarla.")
        : t("votacion.resultado_listo", "🗳️ Votación terminada. Resultado: {resultado}. Pulsa la canción que decidas lanzar.", { resultado: resumen });

      registrarEventoAnfitrion('votacion', mensaje);
      activos.forEach(conn => {
        try {
          conn.send({
            accion: "VOTACION_RESULTADO_LISTO",
            votacionId: estadoVotacion.votacionId
          });
        } catch (error) {
          console.error("No se pudo avisar al invitado del cierre de votos.", error);
        }
      });
      renderPlaylists();
      mostrarAvisoVotacion(mensaje);
    }
  } else if (tiempoAgotado) {
    registrarEventoAnfitrion('votacion', t('p2p.log_voto_sin_quorum', 'Votación cerrada sin quórum: {votos} de {total} votos.', {
      votos: totalVotados,
      total: totalConectados
    }));
    activos.forEach(conn => {
      try {
        conn.send({
          accion: "VOTACION_CERRADA_SIN_QUORUM",
          votacionId: estadoVotacion.votacionId,
          votos: totalVotados,
          total: totalConectados
        });
      } catch (error) {
        console.error("No se pudo avisar al invitado del cierre de votación.", error);
      }
    });

    // Tiempo agotado sin quórum suficiente: cerramos la votación y avisamos a la sala.
    estadoVotacion.activa = false;
    estadoVotacion.votosPorCancion = {};
    if (estadoVotacion.timerCierre) clearTimeout(estadoVotacion.timerCierre);
    conexionesClub.forEach(c => {
      if (c) {
        c.haVotado = false;
        c.votoTitulo = "";
      }
    });
    renderPlaylists();
    retransmitirListaUsuariosATodos();
    if (typeof actualizarListaUsuariosUI === 'function') actualizarListaUsuariosUI();
  }
}


function lanzarCancionGanadoraClub(songId) {
  estadoVotacion.activa = false;
  if (estadoVotacion.timerCierre) clearTimeout(estadoVotacion.timerCierre);

  // 1. Limpiamos marcas y títulos de votación de todos los conectados
  conexionesClub.forEach(c => {
    if (c) {
      c.haVotado = false;
      c.votoTitulo = "";
    }
  });
  retransmitirListaUsuariosATodos();
  if (typeof actualizarListaUsuariosUI === 'function') actualizarListaUsuariosUI();

   const idx = songs.findIndex(s => s.id === songId);
  if (idx === -1) return;
  const song = songs.at(idx);
  if (typeof registrarEventoAnfitrion === 'function') {
    registrarEventoAnfitrion('votacion', t('p2p.log_voto_ganadora', 'Ganadora lanzada: {titulo}', { titulo: song.titulo }));
  }


  // 2. Cerramos el panel de listas y su overlay oscuro si estaban visibles en pantalla
  const panel = document.getElementById("playlistPanel");

  }

  // 3. Ocultamos la modal de sala P2P para dejar despejado el visor
  const modalClub = document.getElementById('modalP2PClub');
if (modalClub) modalClub.remove();


  // 4. Abrimos la canción en el Visor del Anfitrión (sin notificación flotante a sí mismo)
  if (typeof openReading === "function") {
    openReading(idx);
  }

  // 5. Enviamos la canción oficialmente a todas las tablets conectadas
  const selectorTono = document.getElementById('keySelect');
  const tonoActual = selectorTono ? selectorTono.value : "0";
  conexionesClub.forEach(conn => {
    if (conn.open) {
      conn.send({
        accion: "ALERTA_OFICIAL_CLUB",
        datos: song,
        desplazamientoTono: tonoActual
      });
    }
  });
  renderPlaylists();
}

function tocarAcordeFinalUkedada() {
  try {
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    if (!AudioCtx) return;
    const ctx = new AudioCtx();
    const now = ctx.currentTime;
    // Arpegio ascendente cálido de Cmaj9 en ukelele (C5, E5, G5, B5, D6)
    const notas = [523.25, 659.25, 783.99, 987.77, 1174.66];
    notas.forEach((freq, i) => {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(freq, now + i * 0.09);
      gain.gain.setValueAtTime(0.001, now + i * 0.09);
      gain.gain.linearRampToValueAtTime(0.14, now + i * 0.09 + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.0008, now + i * 0.09 + 1.4);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start(now + i * 0.09);
      osc.stop(now + i * 0.09 + 1.45);
    });
  } catch (e) {}
}

function ukeContarAcordes(letra) {
  if (!letra) return 0;
  const regexBloques = new RegExp("\\[([^\\]]+)\\]", "g");
  const regexAcorde = new RegExp("^[A-G](#|b)?(m|M|maj|min|dim|aug|sus|add|7|9|11|13|6|5|4|2|º|\\+|°)*(\\/[A-G](#|b)?)?$");
  const palabrasIgnorar = new Set(["intro", "estrofa", "estribillo", "coro", "chorus", "verse", "bridge", "puente", "outro", "final", "fin", "solo", "instrumental", "bis", "x2", "x3", "x4"]);

  const bloques = letra.match(regexBloques) || [];
  const unicos = new Set();

  bloques.forEach(bloque => {
    let contenido = bloque.slice(1, -1).trim();
    if (contenido.indexOf(":") !== -1) {
      contenido = contenido.split(":").slice(1).join(":").trim();
    }
    contenido.split(/[\s,|;-]+/).forEach(palabra => {
      const limpia = palabra.trim();
      if (!limpia || palabrasIgnorar.has(limpia.toLowerCase())) return;
      if (regexAcorde.test(limpia)) unicos.add(limpia);
    });
  });
  return unicos.size;
}

(function() {
  let ctx = null, play = false, timer = null;
  let bpm = 110, comp = 4, sub = 1, nextT = 0, step = 0, taps = [];

  const getEl = id => document.getElementById(id);
  const tienePermiso = () => Boolean((typeof soyElAnfitrion !== 'undefined' && soyElAnfitrion) || (typeof tengoPermisoCuentaAtras !== 'undefined' && tengoPermisoCuentaAtras));

  function actualizarLeds() {
    const cont = getEl('ukeMetroLeds');
    if (!cont) return;
    cont.innerHTML = '';
    for (let i = 0; i < comp; i++) {
      const d = document.createElement('div');
      d.className = 'uke-metro-led' + (i === 0 ? ' acento' : '');
      cont.appendChild(d);
    }
  }

  function setBpm(valor) {
    bpm = Math.max(30, Math.min(260, parseInt(valor, 10) || 110));
    if (getEl('ukeMetroVal')) getEl('ukeMetroVal').textContent = bpm;
    if (getEl('ukeMetroHeadBpm')) getEl('ukeMetroHeadBpm').textContent = bpm;
  }

  function tocarPulso(tiempo, nivel) {
    // nivel: 0 = acento (880Hz), 1 = normal (440Hz), 2 = subdivisión (330Hz)
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = 'triangle';

    const freq = nivel === 0 ? 880 : (nivel === 2 ? 330 : 440);
    const vol = nivel === 0 ? 0.35 : (nivel === 2 ? 0.12 : 0.25);

    osc.frequency.setValueAtTime(freq, tiempo);
    osc.frequency.exponentialRampToValueAtTime(freq * 0.5, tiempo + 0.05);

    gain.gain.setValueAtTime(vol, tiempo);
    gain.gain.exponentialRampToValueAtTime(0.001, tiempo + 0.08);

    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start(tiempo);
    osc.stop(tiempo + 0.09);
  }

  function planificador() {
    const factor = (comp === 6 && sub === 1) ? 0.5 : 1;
    const dur = (60 / bpm / sub) * factor;

    while (nextT < ctx.currentTime + 0.1) {
      const esPulso = (step % sub === 0);
      const idx = Math.floor(step / sub) % comp;

      if (esPulso) {
        tocarPulso(nextT, idx === 0 ? 0 : 1);
        const retraso = Math.max(0, (nextT - ctx.currentTime) * 1000);
        setTimeout(() => {
          if (!play) return;
          document.querySelectorAll('.uke-metro-led').forEach((l, i) => l.classList.toggle('encendido', i === idx));
          const btn = getEl('btnVisorMetronomo');
          if (btn) {
            btn.classList.add('pulso');
            setTimeout(() => btn.classList.remove('pulso'), 80);
          }
        }, retraso);
      } else {
        tocarPulso(nextT, 2);
      }

      nextT += dur;
      step++;
    }
    timer = setTimeout(planificador, 25);
  }

  window.detenerMetronomoUke = function() {
    play = false;
    clearTimeout(timer);
    if (getEl('ukeMetroPlay')) {
      getEl('ukeMetroPlay').textContent = '▶';
      getEl('ukeMetroPlay').classList.remove('activo');
    }
    if (getEl('btnVisorMetronomo')) getEl('btnVisorMetronomo').classList.remove('sonando');
    if (getEl('ukeMetroModal')) getEl('ukeMetroModal').classList.remove('abierta');
    document.querySelectorAll('.uke-metro-led').forEach(l => l.classList.remove('encendido'));
  };

  window.cargarTempoDesdeSong = function(song) {
    if (!song) return;
    const texto = song.contenido || song.letra || song.chordpro || '';
    const matchTempo = texto.match(/\{(?:tempo|t):\s*(\d+)\}/i);
    const matchCompas = texto.match(/\{time:\s*(\d+)\/\d+\}/i);

    const detectado = song.bpm || song.tempo || (matchTempo ? matchTempo : 110);
    setBpm(detectado);

    if (matchCompas) {
      const c = parseInt(matchCompas, 10);
      const sel = getEl('ukeMetroCompas');
      if (sel && (c === 2 || c === 3 || c === 4 || c === 6)) {
        sel.value = String(c);
        sel.dispatchEvent(new Event('change'));
      }
    }
  };

  window.inicializarBotonMetronomo = function() {
    const permitido = (typeof MODO_ALUMNO !== 'undefined' && MODO_ALUMNO) || tienePermiso();
    let btnMetro = getEl('btnVisorMetronomo');

    // Si ya existe, solo sincronizamos visibilidad (Anfitrión o VIP)
    if (btnMetro) {
      btnMetro.style.display = permitido ? 'inline-flex' : 'none';
      if (!permitido) window.detenerMetronomoUke();
      return;
    }

    // Si no tiene permiso aún, no inyectamos nada hasta que lo tenga
    if (!permitido) return;

    // 1. Crear botón en la barra superior junto a Cuenta Atrás
    btnMetro = document.createElement('button');
    btnMetro.id = 'btnVisorMetronomo';
    btnMetro.type = 'button';
    btnMetro.title = typeof t === 'function' ? t('p2p.visor.title_metro', 'Metrónomo') : 'Metrónomo';
    btnMetro.style = "display:inline-flex; background:rgba(255,255,255,0.1); color:#ffffff; border:1px solid rgba(255,255,255,0.25); padding:0.35rem 0.65rem; border-radius:4px; font-weight:600; cursor:pointer; margin-right:6px; font-size:0.8rem; align-items:center; gap:5px; vertical-align:middle;";
    btnMetro.innerHTML = `<span class="uke-metro-dot"></span>🎵 <span id="ukeMetroHeadBpm">${bpm}</span>`;

    const btnCuenta = getEl('btnVisorCuentaAtras');
    const selTono = getEl('keySelect');
    const ref = btnCuenta || (selTono ? selTono.previousElementSibling : null);
    if (ref && ref.parentNode) {
      ref.parentNode.insertBefore(btnMetro, ref);
    }

    // 2. Crear modal flotante arrastrable dentro de #readingMode
    const contenedor = getEl('readingMode') || document.body;
    const modal = document.createElement('div');
    modal.className = 'uke-metro-modal';
    modal.id = 'ukeMetroModal';
    const tituloTxt = typeof t === 'function' ? t('p2p.visor.metronomo', 'METRÓNOMO') : 'METRÓNOMO';
    
    modal.innerHTML = `
      <div class="uke-metro-header" id="ukeMetroDragHeader" title="Arrastra para mover">
        <span class="uke-metro-title">⠿ ${tituloTxt}</span>
        <button type="button" class="uke-metro-close" id="ukeMetroClose">✕</button>
      </div>
      <div class="uke-metro-row">
        <button type="button" class="uke-metro-play" id="ukeMetroPlay">▶</button>
        <div class="uke-metro-bpm-box">
          <button type="button" id="ukeMetroDown">-</button>
          <span class="uke-metro-bpm-val" id="ukeMetroVal">${bpm}</span>
          <button type="button" id="ukeMetroUp">+</button>
        </div>
      </div>
      <div class="uke-metro-leds" id="ukeMetroLeds"></div>
      <div class="uke-metro-row">
        <select class="uke-metro-select" id="ukeMetroCompas">
          <option value="4">4/4</option><option value="3">3/4</option><option value="2">2/4</option><option value="6">6/8</option>
        </select>
        <select class="uke-metro-select figura" id="ukeMetroFigura">
          <option value="1">♩</option><option value="2">♫</option><option value="3">♩³</option>
        </select>
        <button type="button" class="uke-metro-tap" id="ukeMetroTap">TAP</button>
      </div>
    `;
    contenedor.appendChild(modal);
    actualizarLeds();

    // 3. Conectar eventos de arrastre (ratón + táctil)
    let drag = false, ox = 0, oy = 0;
    const header = getEl('ukeMetroDragHeader');
    header.addEventListener('pointerdown', e => {
      if (e.target.id === 'ukeMetroClose') return;
      drag = true;
      const r = modal.getBoundingClientRect();
      ox = e.clientX - r.left; oy = e.clientY - r.top;
      modal.style.right = 'auto';
      header.setPointerCapture(e.pointerId);
    });
    header.addEventListener('pointermove', e => {
      if (!drag) return;
      modal.style.left = Math.max(0, Math.min(window.innerWidth - modal.offsetWidth, e.clientX - ox)) + 'px';
      modal.style.top = Math.max(0, Math.min(window.innerHeight - modal.offsetHeight, e.clientY - oy)) + 'px';
    });
    header.addEventListener('pointerup', () => drag = false);

    // 4. Conectar controles internos
    btnMetro.onclick = () => modal.classList.toggle('abierta');
    getEl('ukeMetroClose').onclick = () => modal.classList.remove('abierta');
    getEl('ukeMetroDown').onclick = () => setBpm(bpm - 1);
    getEl('ukeMetroUp').onclick = () => setBpm(bpm + 1);

    getEl('ukeMetroCompas').onchange = e => {
      comp = parseInt(e.target.value, 10);
      step = 0;
      const fig = getEl('ukeMetroFigura');
      fig.disabled = (comp === 6);
      if (comp === 6) { sub = 1; fig.value = '1'; }
      actualizarLeds();
    };

    getEl('ukeMetroFigura').onchange = e => {
      sub = parseInt(e.target.value, 10);
      step = 0;
    };

    getEl('ukeMetroTap').onclick = () => {
      const now = performance.now();
      if (taps.length && now - taps[taps.length - 1] > 2000) taps = [];
      taps.push(now);
      if (taps.length > 4) taps.shift();
      if (taps.length > 1) {
        const diff = (taps[taps.length - 1] - taps) / (taps.length - 1);
        setBpm(Math.round(60000 / diff));
      }
    };

    getEl('ukeMetroPlay').onclick = () => {
      if (!ctx) ctx = new (window.AudioContext || window.webkitAudioContext)();
      play = !play;
      getEl('ukeMetroPlay').textContent = play ? '■' : '▶';
      getEl('ukeMetroPlay').classList.toggle('activo', play);
      btnMetro.classList.toggle('sonando', play);

      if (play) {
        if (ctx.state === 'suspended') ctx.resume();
        step = 0;
        nextT = ctx.currentTime + 0.05;
        planificador();
      } else {
        clearTimeout(timer);
        document.querySelectorAll('.uke-metro-led').forEach(l => l.classList.remove('encendido'));
      }
    };
  };
})();

const ChordProManager = (function() {
  const chromaticSharp = ['C', 'C#', 'D', 'D#', 'E', 'F', 'F#', 'G', 'G#', 'A', 'A#', 'B'];
  const flatToSharp = { 'Db': 'C#', 'Eb': 'D#', 'Gb': 'F#', 'Ab': 'G#', 'Bb': 'A#' };
  const euroMap = { 'C': 'Do', 'D': 'Re', 'E': 'Mi', 'F': 'Fa', 'G': 'Sol', 'A': 'La', 'B': 'Si' };

  function transposeChord(chord, semitones) {
    if (!chord || semitones === 0) return chord;
    return chord.replace(/([A-G][#b]?)/g, (match) => {
      const note = flatToSharp[match] || match;
      const idx = chromaticSharp.indexOf(note);
      if (idx === -1) return match;
      const newIdx = (idx + (semitones % 12) + 12) % 12;
      return chromaticSharp[newIdx];
    });
  }

  function formatChord(chord, notation) {
    if (!chord || notation === 'sajon') return chord;
    if (notation === 'aleman') {
      return chord.replace(/\bBb/g, 'B').replace(/\bB(?!b)/g, 'H');
    }
    if (notation === 'europeo') {
      return chord.replace(/\b([A-G])/g, m => euroMap[m] || m);
    }
    return chord;
  }

  function songToStandardPro(song) {
    const lines = [];
    if (song.titulo) lines.push(`{title: ${song.titulo}}`);
    if (song.artista) lines.push(`{artist: ${song.artista}}`);
    if (song.bpm) lines.push(`{tempo: ${song.bpm}}`);
    if (song.anio) lines.push(`{year: ${song.anio}}`);
    if (song.genero) lines.push(`{meta: genero ${song.genero}}`);
    if (song.idioma) lines.push(`{meta: idioma ${song.idioma}}`);
    if (song.video) lines.push(`{meta: video ${song.video}}`);
    lines.push('');
    lines.push((song.letra || '').replace(/\r\n/g, '\n').trim());
    return lines.join('\n');
  }

  function proToAppSongs(proText) {
    const baseId = Date.now();
    return proText.split(/^\{(?:new_song|ns)\}/im).map((block, idx) => {
      const song = {
        id: baseId + idx,
        titulo: 'Sin título',
        artista: '',
        genero: null,
        bpm: null,
        tono: null,
        capo: null,
        anio: null,
        idioma: null,
        video: null,
        letra: ''
      };
      const bodyLines = [];

      block.trim().split('\n').forEach(line => {
        const t = line.trim();
        let m;
        if ((m = t.match(/^\{(?:title|t):([^\}]+)\}/i))) song.titulo = m.at(1).trim();
        else if ((m = t.match(/^\{(?:artist|st|subtitle):([^\}]+)\}/i))) song.artista = m.at(1).trim();
        else if ((m = t.match(/^\{tempo:([^\}]+)\}/i))) song.bpm = m.at(1).trim();
        else if ((m = t.match(/^\{(?:tempo|metronome):([^\}]+)\}/i))) song.bpm = m.at(1).trim();
        else if ((m = t.match(/^\{key:([^\}]+)\}/i))) song.tono = m.at(1).trim();
        else if ((m = t.match(/^\{capo:([^\}]+)\}/i))) song.capo = m.at(1).trim();
        else if ((m = t.match(/^\{year:([^\}]+)\}/i))) song.anio = m.at(1).trim();
        else if ((m = t.match(/^\{meta:\s*genero\s+([^\}]+)\}/i))) song.genero = m.at(1).trim();
        else if ((m = t.match(/^\{meta:\s*idioma\s+([^\}]+)\}/i))) song.idioma = m.at(1).trim();
        else if ((m = t.match(/^\{meta:\s*video\s+([^\}]+)\}/i))) song.video = m.at(1).trim();
        else bodyLines.push(line);
      });

      while (bodyLines.length && bodyLines.at(0).trim() === '') bodyLines.shift();
      song.letra = bodyLines.join('\r\n');
      return song;
    }).filter(s => s.letra.length > 0 || s.titulo !== 'Sin título');
  }

    // Función auxiliar: si la línea i solo tiene [Acordes] y espacios, los incrusta en la línea de letra i+1 por su posición exacta
      function mergeChordOnlyLines(lines) {

      if (isChordOnly && next !== undefined && next.trim() !== '' && !next.trim().startsWith('{') && !/^\s*(\[[^\]]+\]\s*)+$/.test(next)) {
        const chordPositions = [];
        let visualCol = 0;
        current.split(/(\[[^\]]+\])/g).forEach(part => {
          if (part.startsWith('[') && part.endsWith(']')) {
            chordPositions.push({ col: visualCol, chord: part });
          } else {
            visualCol += part.length;
          }
        });

        let targetLine = next.trimEnd();
        const extraChords = [];

        // Separa los acordes que caen dentro del texto de los que sobran por la derecha
        const insideChords = [];
        chordPositions.forEach(item => {
          if (item.col >= targetLine.length) {
            extraChords.push(item.chord);
          } else {
            insideChords.push(item);
          }
        });

        // Inserta de derecha a izquierda los que van sobre las palabras
        insideChords.reverse().forEach(item => {
          targetLine = targetLine.slice(0, item.col) + item.chord + targetLine.slice(item.col);
        });

        // Los que van al final del verso se añaden separados por un solo espacio (sin huecos gigantes)
        if (extraChords.length > 0) {
          targetLine += ' ' + extraChords.join(' ');
        }

        merged.push(targetLine);
        i++;
      } else {
        merged.push(current);
      }
    }
    return merged;
  }
  
  function renderTabSVG(tabLines) {
  const cleanLines = tabLines.filter(l => l.trim().length > 0);
  if (cleanLines.length === 0) return '';

  let chordHeader = null;
  let fingerRaw = null;
  let stringLines = [...cleanLines];

  while (stringLines.length > 0) {
    const top = stringLines.at(0);
    if (top.trimStart().startsWith('^')) {
      const mF = top.match(/^\s*\^\s*\|?(.*)$/);
      fingerRaw = mF ? mF.at(1) : top.slice(1);
      stringLines.shift();
    } else if (!top.includes('|')) {
      chordHeader = top.replace(/^\s*\./, ' ');
      stringLines.shift();
    } else {
      break;
    }
  }

  const rawParsed = stringLines.map(line => {
    const m = line.match(/^\s*([A-Ga-g1-6][#b]?)\s*\|(.*)$/);
    const label = m ? m.at(1) : '';
    const rawBody = (m ? m.at(2) : line).replace(/\|\s*$/, '');
    const bars = rawBody.split('|').map(b => b.trimEnd());
    return { label, bars };
  });

  const numStrings = rawParsed.length;
  if (numStrings === 0) return '';

  const numBars = Math.max(...rawParsed.map(p => p.bars.length));
  const barWidths = [];
  for (let b = 0; b < numBars; b++) {
    const maxBarLen = Math.max(...rawParsed.map(p => (p.bars.at(b) || '').length), 1);
    barWidths.push(maxBarLen);
  }

  const parsed = rawParsed.map(p => {
    const alignedBars = barWidths.map((w, b) => (p.bars.at(b) || '').padEnd(w, '-'));
    return { label: p.label, body: alignedBars.join('|') + '|' };
  });

  let fingerBody = null;
  if (fingerRaw !== null) {
    const fBars = fingerRaw.replace(/\|\s*$/, '').split('|').map(b => b.trimEnd());
    const alignedFBars = barWidths.map((w, b) => (fBars.at(b) || '').padEnd(w, '-'));
    fingerBody = alignedFBars.join('|') + '|';
  }

  const maxCols = parsed.at(0).body.length;
  const hasLabels = parsed.some(p => p.label !== '');

  const leftPad = hasLabels ? 22 : 10;
  const colWidth = 6.8;
  const rowHeight = 11.5;
  const topPad = (chordHeader ? 14 : 0) + (fingerBody ? 14 : 0) + 28;

  const colX = [];
  let curX = leftPad + 6;
  for (let col = 0; col < maxCols; col++) {
    if (parsed.at(0).body.charAt(col) === '|') {
      colX.push(curX + 2);
      curX += 9;
    } else {
      colX.push(curX + colWidth / 2);
      curX += colWidth;
    }
  }

  const endX = colX.at(-1);
  const width = endX + 12;
  const height = topPad + (numStrings - 1) * rowHeight + 10;
  const refWidth = Math.max(width, window._tabTieneLetra ? 300 : 560);

  let svg = `<div class="cp-tab-svg" style="break-inside:avoid; margin: 0.75em 0; overflow:hidden; color: inherit;">`;
   svg += `<svg style="width:100%; max-width:${(refWidth / 13.5).toFixed(1)}em; height:auto; display:block;" viewBox="0 0 ${refWidth} ${height}">`;

  if (chordHeader) {
    const rawMaxLen = Math.max(...stringLines.map(l => l.replace(/^\s*[A-Ga-g1-6][#b]?\s*\|/, '').length), chordHeader.length);
    const scale = rawMaxLen > 0 ? maxCols / rawMaxLen : 1;
    const chordMatches = [...chordHeader.matchAll(/\S+/g)];
    chordMatches.forEach(m => {
      const idx = Math.min(Math.round(m.index * scale), colX.length - 1);
      const x = idx >= 0 ? colX.at(idx) : leftPad + 6;
      svg += `<text x="${x}" y="11" fill="var(--chord-color, #f4a261)" font-family="Arial, sans-serif" font-size="11.5" font-weight="bold">${m.at(0)}</text>`;
    });
  }

  if (fingerBody) {
    const fingerY = chordHeader ? 23 : 10;
    for (let col = 0; col < fingerBody.length && col < colX.length; col++) {
      const d = fingerBody.charAt(col);
      if (!d || d === '-' || d === ' ' || d === '|') continue;
      const x = colX.at(col);
      svg += `<circle cx="${x}" cy="${fingerY - 2.5}" r="4.6" fill="none" stroke="currentColor" stroke-opacity="0.7" stroke-width="0.8"/>`;
      svg += `<text x="${x}" y="${fingerY}" text-anchor="middle" fill="currentColor" font-family="Arial, sans-serif" font-size="7.2" font-weight="bold">${d}</text>`;
    }
  }

  const topY = topPad;
  const botY = topPad + (numStrings - 1) * rowHeight;

  if (!window._tabCompasCounter) window._tabCompasCounter = 1;
  svg += `<text x="${leftPad}" y="${topY - 22}" text-anchor="middle" fill="currentColor" fill-opacity="0.55" font-family="Georgia, serif" font-style="italic" font-size="8.5">${window._tabCompasCounter}</text>`;
  svg += `<line x1="${leftPad}" y1="${topY}" x2="${leftPad}" y2="${botY}" stroke="currentColor" stroke-opacity="0.85" stroke-width="1.4"/>`;

  for (let col = 0; col < maxCols; col++) {
    if (parsed.at(0).body.charAt(col) === '|') {
      const x = colX.at(col);
      svg += `<line x1="${x}" y1="${topY}" x2="${x}" y2="${botY}" stroke="currentColor" stroke-opacity="0.85" stroke-width="1.4"/>`;
      if (col < maxCols - 1) {
        window._tabCompasCounter++;
        svg += `<text x="${x}" y="${topY - 22}" text-anchor="middle" fill="currentColor" fill-opacity="0.55" font-family="Georgia, serif" font-style="italic" font-size="8.5">${window._tabCompasCounter}</text>`;
      }
    }
  }
  window._tabCompasCounter++;

  const hayNotaEnCol = new Array(maxCols).fill(false);
  for (let col = 0; col < maxCols; col++) {
    if (parsed.at(0).body.charAt(col) === '|') continue;
    for (let r = 0; r < parsed.length; r++) {
      const ch = parsed.at(r).body.charAt(col);
      const prev = col > 0 ? parsed.at(r).body.charAt(col - 1) : '';
      if (/\d/.test(ch) && !/\d/.test(prev)) {
        hayNotaEnCol[col] = true;
        break;
      }
    }
  }

  const beamTop = topY - 18;
  const stemBase = topY - 5;
  const pendientes = [];

  function cerrarGrupoPlicas() {
    if (pendientes.length >= 2) {
      const x1 = pendientes.at(0).x;
      const x2 = pendientes.at(-1).x;
      svg += `<line x1="${x1}" y1="${beamTop}" x2="${x2}" y2="${beamTop}" stroke="currentColor" stroke-opacity="0.9" stroke-width="2"/>`;
      if (pendientes.some(p => p.fig === '16')) {
        svg += `<line x1="${x1}" y1="${beamTop + 3.5}" x2="${x2}" y2="${beamTop + 3.5}" stroke="currentColor" stroke-opacity="0.9" stroke-width="1.6"/>`;
      }
    } else if (pendientes.length === 1) {
      const p = pendientes.at(0);
      svg += `<path d="M ${p.x} ${beamTop} Q ${p.x + 4.5} ${beamTop + 2.5} ${p.x + 5.5} ${beamTop + 7}" fill="none" stroke="currentColor" stroke-opacity="0.9" stroke-width="1.4"/>`;
    }
    pendientes.length = 0;
  }
  let pasosDesdeBarra = 0;
  for (let col = 0; col < maxCols; col++) {
    if (parsed.at(0).body.charAt(col) === '|') {
      cerrarGrupoPlicas();
      pasosDesdeBarra = 0;
      continue;
    }

    if (hayNotaEnCol[col]) {
      if (pasosDesdeBarra > 0 && pasosDesdeBarra % 5 === 0) cerrarGrupoPlicas();

      let dist = 1;
      while (col + dist < maxCols && parsed.at(0).body.charAt(col + dist) !== '|' && !hayNotaEnCol[col + dist]) {
        dist++;
      }

      const x = colX.at(col);
      let fig = '4';
      if (dist >= 12) fig = '1';
      else if (dist >= 6) fig = '2';
      else if (dist >= 4) fig = '4';
      else if (dist >= 2) fig = '8';
      else fig = '16';

      if (fig === '1') {
        cerrarGrupoPlicas();
      } else if (fig === '2') {
        cerrarGrupoPlicas();
        svg += `<line x1="${x}" y1="${beamTop + 6}" x2="${x}" y2="${stemBase}" stroke="currentColor" stroke-opacity="0.9" stroke-width="1.2"/>`;
      } else if (fig === '4') {
        cerrarGrupoPlicas();
        svg += `<line x1="${x}" y1="${beamTop}" x2="${x}" y2="${stemBase}" stroke="currentColor" stroke-opacity="0.9" stroke-width="1.2"/>`;
      } else if (fig === '8' || fig === '16') {
        svg += `<line x1="${x}" y1="${beamTop}" x2="${x}" y2="${stemBase}" stroke="currentColor" stroke-opacity="0.9" stroke-width="1.2"/>`;
        pendientes.push({ x, fig });
      }
    }
    pasosDesdeBarra++;
  }
  cerrarGrupoPlicas();

  parsed.forEach((p, row) => {
    const y = topPad + row * rowHeight;

    if (p.label) {
      svg += `<text x="6" y="${y + 3.6}" fill="currentColor" fill-opacity="0.85" font-family="Arial, sans-serif" font-size="11" font-weight="bold">${p.label}</text>`;
    }

    const huecos = [];

    for (let col = 0; col < maxCols; col++) {
      const ch = p.body.charAt(col);
      if (!ch || ch === '-' || ch === ' ' || ch === '|') continue;

      const prev = col > 0 ? p.body.charAt(col - 1) : '';
      if (/\d/.test(ch) && /\d/.test(prev)) continue;

      const x = colX.at(col);
      let token = ch;
      let tokenX = x;

      if (/\d/.test(ch) && /\d/.test(p.body.charAt(col + 1) || '')) {
        token = ch + p.body.charAt(col + 1);
        tokenX = x + colWidth / 2;
      }

      const gapHalf = token.length > 1 ? 6.8 : 4.8;
      huecos.push({ start: tokenX - gapHalf, end: tokenX + gapHalf });

      if (ch === ':') {
        svg += `<circle cx="${x}" cy="${y - 3.2}" r="1.5" fill="currentColor"/>`;
        svg += `<circle cx="${x}" cy="${y + 3.2}" r="1.5" fill="currentColor"/>`;
      } else if (ch === '/') {
        svg += `<line x1="${x - 3.5}" y1="${y + 3.5}" x2="${x + 3.5}" y2="${y - 3.5}" stroke="currentColor" stroke-width="1.2"/>`;
      } else if (ch === '\\') {
        svg += `<line x1="${x - 3.5}" y1="${y - 3.5}" x2="${x + 3.5}" y2="${y + 3.5}" stroke="currentColor" stroke-width="1.2"/>`;
      } else if (ch === 'h' || ch === 'p') {
        svg += `<path d="M ${x - 4} ${y - 3.5} Q ${x} ${y - 8.5} ${x + 4} ${y - 3.5}" fill="none" stroke="currentColor" stroke-width="1.1"/>`;
        svg += `<text x="${x}" y="${y - 6}" text-anchor="middle" fill="currentColor" font-family="Arial, sans-serif" font-size="7" font-weight="bold">${ch.toUpperCase()}</text>`;
      } else if (ch === 'x' || ch === 'X') {
        svg += `<text x="${x}" y="${y + 3.5}" text-anchor="middle" fill="currentColor" font-family="Arial, sans-serif" font-size="10" font-weight="bold">✕</text>`;
      } else if (ch === '~') {
        svg += `<path d="M ${x - 4} ${y} Q ${x - 2} ${y - 3} ${x} ${y} T ${x + 4} ${y}" fill="none" stroke="currentColor" stroke-width="1.1"/>`;
      } else {
        svg += `<text x="${tokenX}" y="${y + 3.6}" text-anchor="middle" fill="currentColor" font-family="Arial, sans-serif" font-size="10.5" font-weight="bold">${token}</text>`;
      }
    }

    let cursorX = leftPad;
    huecos.forEach(h => {
      if (h.start > cursorX) {
        svg += `<line x1="${cursorX}" y1="${y}" x2="${h.start}" y2="${y}" stroke="currentColor" stroke-opacity="0.6" stroke-width="0.7"/>`;
      }
      cursorX = Math.max(cursorX, h.end);
    });
    if (cursorX < endX) {
      svg += `<line x1="${cursorX}" y1="${y}" x2="${endX}" y2="${y}" stroke="currentColor" stroke-opacity="0.6" stroke-width="0.7"/>`;
    }
  });

  svg += `</svg></div>`;
  return svg;
}

   ///////////////////////////////////////////////////////////////////
    function buildHTML(letraText, options) {
    const { layout = 'above', notation = 'sajon', semitones = 0, columns = 1, fontSize = 16 } = options;
    let html = `<div class="cp-render ${layout === 'inline' ? 'inline-mode' : 'above-mode'}" style="column-count:${columns}; column-gap:30px; font-size:${fontSize}px;">`;
    let inTab = false, tabBuffer = [];

    const normalizedText = (letraText || '').replace(/\r\n/g, '\n').replace(/\n{3,}/g, '\n\n');
    const processedLines = mergeChordOnlyLines(normalizedText.split('\n'));

    processedLines.forEach(rawLine => {
      const t = rawLine.trim();

      if (t === '' && !inTab) {
        html += `<div class="cp-line cp-empty-line"></div>`;
        return;
      }

      // 1. Tablaturas {sot} / {eot}
      if (/^\{(?:sot|start_of_tab)(?::([^\}]*))?\}/i.test(t)) {
        inTab = true; tabBuffer = [];
        const tabTitle = t.match(/^\{(?:sot|start_of_tab):([^\}]+)\}/i);
        if (tabTitle && tabTitle.at(1).trim()) html += `<div class="cp-comment">${tabTitle.at(1).trim()}</div>`;
        return;
      }
            if (/^\{(?:eot|end_of_tab)\}/i.test(t)) {
        inTab = false;
        html += renderTabSVG(tabBuffer);
        return;
      }

      if (inTab) { tabBuffer.push(rawLine); return; }

      // 2. Estribillos {soc}/{eoc} y Partes {sop: Verse 1}/{eop}
      if (/^\{(?:soc|start_of_chorus|sop|start_of_part)(?::([^\}]*))?\}/i.test(t)) {
        const isChorus = /^\{(?:soc|start_of_chorus)/i.test(t);
        html += `<div class="${isChorus ? 'cp-chorus' : 'cp-part'}">`;
        const partTitle = t.match(/^\{[^:]+:([^\}]+)\}/i);
        if (partTitle && partTitle.at(1).trim()) {
          html += `<div class="cp-comment">${partTitle.at(1).trim()}</div>`;
        }
        return;
      }
      if (/^\{(?:eoc|end_of_chorus|eop|end_of_part)\}/i.test(t)) {
        html += `</div>`;
        return;
      }

      // 3. Resaltados {soh}Texto{eoh} y comentarios {c:}, {ci:}, {cb:}
      if (/^\{(?:soh|start_of_highlight)\}(.*)\{(?:eoh|end_of_highlight)\}$/i.test(t)) {
        const cleanText = t.replace(/^\{(?:soh|start_of_highlight)\}|\{(?:eoh|end_of_highlight)\}$/gi, '').trim();
        if (cleanText) html += `<div class="cp-comment">${cleanText}</div>`;
        return;
      }
      if (/^\{(?:comment|c|ci|cb|comment_italic|comment_box):([^\}]*)\}/i.test(t)) {
        const cleanComment = t.replace(/^\{[^:]+:|\}/gi, '').trim();
        if (cleanComment) html += `<div class="cp-comment">${cleanComment}</div>`;
        else html += `<div style="height: 0.6em;"></div>`;
        return;
      }

      // 4. Ignora directivas técnicas ({midi:...}, {define:...}, etc.)
      if ((t.startsWith('{') && t.endsWith('}')) || t.startsWith('#')) return;

      const cleanLine = rawLine.replace(/\{(?:soh|eoh|start_of_highlight|end_of_highlight)\}/gi, '');

      // 5. Renderizado de verso
      html += `<div class="cp-line" style="break-inside:avoid;">`;
      const parts = cleanLine.split(/(\[[^\]]+\])/g);
      let currentSajon = '', currentVisual = '';

            parts.forEach(part => {
        if (part.startsWith('[') && part.endsWith(']')) {
          currentSajon = transposeChord(part.slice(1, -1), semitones);
          currentVisual = formatChord(currentSajon, notation);
        } else if (part !== '' || currentVisual !== '') {
          if (currentSajon) {
            const dataAttr = ` data-chord="${currentSajon}"`;
            const tooltipHTML = `<span class="chord-tooltip">${getChordSVG(currentSajon)}</span>`;
            html += `<span class="cp-seg"><span class="cp-chord chord-span"${dataAttr}>${currentVisual}${tooltipHTML}</span><span class="cp-lyric">${part || ' '}</span></span>`;
          } else {
            const spacer = layout === 'above' ? `<span class="cp-chord" style="visibility:hidden;">&nbsp;</span>` : '';
            html += `<span class="cp-seg">${spacer}<span class="cp-lyric">${part || ' '}</span></span>`;
          }
          currentSajon = '';
          currentVisual = '';
        }
      });

      html += `</div>`;
    });

    html += `</div>`;
    return html;
  }


  ///////////////////////////////////////////////////////////////////////
  return {
    songToStandardPro,
    proToAppSongs,
    buildHTML,
    exportCancioneroPro: (songsArray) => songsArray.map(songToStandardPro).join('\n\n{new_song}\n\n')
  };
})();

function limpiarCabecerasPro(texto) {
  return texto
    .split('\n')
    .filter(linea => !/^\s*\{(?:title|t|subtitle|st|artist|composer|lyricist|album|year|copyright|key|capo|tempo|duration|time|language|meta)\s*:/i.test(linea))
    .join('\n')
    .replace(/^\s*\n+/, '');
}

function repartirProEnFormulario(textoRaw) {
  if (/^\s*\{(?:title|t|subtitle|st|artist|key|capo|tempo|year|duration|duracion|language|meta)\s*:/im.test(textoRaw)) {
    const lista = ChordProManager.proToAppSongs(textoRaw);
    const parsed = lista.at(0);
    if (parsed) {
      if (parsed.titulo && parsed.titulo !== 'Sin título') document.getElementById('edTitulo').value = parsed.titulo;
      if (parsed.artista) document.getElementById('edArtista').value = parsed.artista;
      if (parsed.genero) document.getElementById('edGenero').value = parsed.genero;
      if (parsed.bpm) document.getElementById('edBpm').value = parsed.bpm;
      if (parsed.tono && document.getElementById('edTono')) document.getElementById('edTono').value = parsed.tono;
      if (parsed.capo && document.getElementById('edCapo')) document.getElementById('edCapo').value = parsed.capo;
      if (parsed.anio) document.getElementById('edAnio').value = parsed.anio;
      if (parsed.idioma) document.getElementById('edIdioma').value = parsed.idioma;
      if (parsed.video) document.getElementById('edVideo').value = parsed.video;
    }

    // Extraer {duration: 4:43} o {duracion: 4:43} directo del texto hacia Song Data
    const mDur = textoRaw.match(/^\s*\{(?:duration|duracion)\s*:\s*([^}]+)\}/im);
    if (mDur && document.getElementById('edDuration')) {
      document.getElementById('edDuration').value = mDur.at(1).trim();
    }
  }

  // Conserva todo el texto original íntegro en la pestaña Letra
  document.getElementById('edLetra').value = textoRaw;
  if (typeof syncLetraHighlight === 'function') syncLetraHighlight();
  updatePreview();
}
////////////////////////////////////////////////////
// 1. Al importar archivo desde el botón 📂 .pro
function cargarProEnEditor(input) {
  const file = input.files.item(0);
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(e) {
    repartirProEnFormulario(e.target.result);
    switchTab('datos');
  };
  reader.readAsText(file);
  input.value = '';
}
/////////////////////////////////////////////////////////////
function importarProAlCancionero(input) {
  const file = input.files.item(0);
  if (!file) return;

  const reader = new FileReader();
  reader.onload = function(e) {
    const nuevasCanciones = ChordProManager.proToAppSongs(e.target.result);

    if (nuevasCanciones.length > 0) {
      songs.push(...nuevasCanciones);
      if (typeof saveData === 'function') saveData();

      if (typeof renderSongList === 'function') renderSongList();
      else if (typeof renderSongs === 'function') renderSongs();
      else if (typeof filterSongs === 'function') filterSongs();

      alert(t('msg.pro_importadas', 'Importadas {n} canción(es). Total en librería: {total}', {
        n: nuevasCanciones.length,
        total: songs.length
      }));
    }
  };
  reader.readAsText(file);
  input.value = '';
}

//////////////////////////////////////////////////
function exportarCancioneroPro() {
  let listaAExportar = [];
  let nombreArchivo = 'cancionero_ukelele';

  // Caso 1: Si el usuario tiene el panel lateral de edición abierto en una canción concreta
  const editorPanel = document.getElementById('editorPanel');
  if (editorPanel && editorPanel.classList.contains('active') && editingIndex >= 0) {
    const cancionActual = songs.at(editingIndex);
    if (cancionActual) {
      listaAExportar = [cancionActual];
      nombreArchivo = cancionActual.titulo || 'cancion';
    }
  } 
  // Caso 2: Si el usuario tiene seleccionada una playlist específica (ej. "Italiana")
  else if (typeof activePlaylist !== 'undefined' && activePlaylist >= 0 && playlists.at(activePlaylist)) {
    const pl = playlists.at(activePlaylist);
    listaAExportar = pl.songs
      .map(id => songs.find(s => s.id === id))
      .filter(Boolean);
    nombreArchivo = pl.name || 'playlist';
  } 
  // Caso 3: Si está en la vista general, exporta todas las canciones del cancionero
  else {
    listaAExportar = songs;
    nombreArchivo = 'cancionero_completo';
  }

   if (listaAExportar.length === 0) {
    alert(t('msg.sin_canciones_exportar', 'No hay canciones para exportar.'));
    return;
  }


  // Genera el texto oficial ChordPro separando múltiples canciones con {new_song}
  const contenidoPro = listaAExportar
    .map(song => ChordProManager.songToStandardPro(song))
    .join('\n\n{new_song}\n\n');

  // Crea y descarga el archivo .pro en UTF-8
  const blob = new Blob([contenidoPro], { type: 'text/plain;charset=utf-8' });
  const enlace = document.createElement('a');
  const nombreLimpio = nombreArchivo.replace(/[^a-z0-9áéíóúñ_-]/gi, '_').toLowerCase();
  
  enlace.href = URL.createObjectURL(blob);
  enlace.download = `${nombreLimpio}.pro`;
  document.body.appendChild(enlace);
  enlace.click();
  document.body.removeChild(enlace);
  URL.revokeObjectURL(enlace.href);
}

function syncLetraHighlight() {
  const ta = document.getElementById('edLetra');
  const bd = document.getElementById('edLetraBackdrop');
  if (!ta || !bd) return;

// Sincronizar colores automáticamente al cambiar de pestaña a 'letra' o al insertar etiquetas
(function enlazarHighlightEditor() {
  const origSwitchTab = window.switchTab;
  if (typeof origSwitchTab === 'function') {
    window.switchTab = function(tabName) {
      origSwitchTab(tabName);
      if (tabName === 'letra') syncLetraHighlight();
    };
  }
  const origInsertTag = window.insertChordProTag;
  if (typeof origInsertTag === 'function') {
    window.insertChordProTag = function(openTag, closeTag, placeholder) {
      origInsertTag(openTag, closeTag, placeholder);
      syncLetraHighlight();
    };
